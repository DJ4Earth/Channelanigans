# November 2026 rerun with the Reactant build that ships Reactant_jll 0.0.443.
#
# Same packages and pins as the repo root's Project.toml (the `current` profile:
# Julia 1.12, Oceananigans 0.116.1, Enzyme 0.13.216, ...), except:
#   * Reactant from `main`, pinned to an exact commit (the first commit that uses
#     Reactant_jll 0.0.443; fill in REACTANT_MAIN_SHA below);
#   * Reactant_jll as a direct dependency, pinned to 0.0.443, so the build records
#     exactly which XLA/MLIR binary ran.
# Any further bumps the new Reactant requires go here, with a note.
#
# Resolve the Manifest (on the Mac, once Reactant_jll 0.0.443 is registered in General):
#   julia --project=envs/jll443 -e 'using Pkg; Pkg.resolve(); Pkg.status()'
# then commit envs/jll443/{Project,Manifest}.toml and build the image with
#   --build-arg ENV_DIR=envs/jll443

[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
Checkpointing = "eb46d486-4f9c-4c3d-b445-a617f2a2f1ca"
Enzyme = "7da242da-08ed-463a-9acd-ee780be4f1d9"
GPUArraysCore = "46192b85-c4d5-4398-a991-12ede77f4527"
InteractiveUtils = "b77e0a4c-d291-57a0-90e8-8db25a27a240"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Oceananigans = "9e8cae18-63c1-5223-a75c-80ca9d6e9a09"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"
Reactant_jll = "0192cb87-2b54-54ad-80e0-3be72ad8a3c0"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"

[sources]
Reactant = {url = "https://github.com/EnzymeAD/Reactant.jl.git", rev = "REACTANT_MAIN_SHA"}


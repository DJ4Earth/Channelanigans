# November 2026 rerun with the Reactant release that ships Reactant_jll 0.0.443.
#
# Same packages and pins as the repo root's Project.toml (the `current` profile, i.e.
# data/vista_2026-11: Julia 1.12.7, Oceananigans 0.116.1, Checkpointing 0.13.0,
# CUDA 6.2.2, ...), except:
#   * Reactant 0.2.304 -> 0.2.308: the registered release that switched to Reactant_jll
#     0.0.443 (Reactant.jl commit dad307ee, 2026-11-09);
#   * Reactant_jll 0.0.443 pinned as a direct dependency, so the build records exactly
#     which XLA/MLIR binary ran (it was 0.0.438 in the 2026-11 runs);
#   * Enzyme 0.13.216 -> 0.13.219 (latest release on 2026-11-09).
#
# Manifest.toml started from the 2026-11 image's Manifest (ghcr.io/jlk9/channelanigans-
# artifact:2026-11-cpu, digest b9c94c1f...) and was re-resolved with these pins, so every
# package these bumps do not require to change keeps its 2026-11 version:
#   julia --project=envs/jll443 -e 'using Pkg; Pkg.resolve(); Pkg.status()'
# Build the image with  --build-arg ENV_DIR=envs/jll443

[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
Checkpointing = "eb46d486-4f9c-4c3d-b445-a617f2a2f1ca"
